name: Exact teammate review policy

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const roster = ['Artfever', 'Abdullah-SE-bit', 'TahaSohail-Goat'];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.number;
            if (!number) throw new Error('No pull request number in event');
            const { data: pr } = await github.rest.pulls.get({owner, repo, pull_number: number});
            const headSha = pr.head.sha;
            let description = '';
            let approved = false;
            if (!roster.includes(pr.user.login)) {
              description = `Unknown responsible human: ${pr.user.login}`;
            } else {
              const expected = roster.filter(user => user !== pr.user.login);
              const reviews = await github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number: number, per_page: 100});
              const latest = new Map();
              for (const review of reviews) {
                if (!expected.includes(review.user?.login)) continue;
                if (review.state === 'COMMENTED') continue;
                latest.set(review.user.login, review);
              }
              const missing = expected.filter(user => {
                const review = latest.get(user);
                return review?.state !== 'APPROVED' || review.commit_id !== headSha;
              });
              approved = missing.length === 0;
              description = approved ? 'Both expected teammates approved this revision' : `Needs current approval: ${missing.join(', ')}`;
            }
            const { data: current } = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (current.head.sha !== headSha) {
              core.info('PR head changed during evaluation; status for old revision will not be published.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha, context: 'review-policy',
              state: approved ? 'success' : 'failure', description,
              target_url: `${context.serverUrl}/${owner}/${repo}/pull/${number}`
            });
            if (!approved) core.setFailed(description);
